<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera AI - Ontology Visualizer</title>
    
    <!-- Load Cytoscape.js via CDN -->
    <script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a;
            color: #ffffff;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        
        #cy {
            width: 100%;
            height: 75vh;
            background-color: #2d2d2d;
            border: 2px solid #444;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .instructions {
            text-align: center;
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>📷 Camera AI: Fractal Ontology Visualizer</h1>
    
    <div id="cy"></div>
    
    <p class="instructions">💡 Tip: Drag nodes to rearrange • Scroll to zoom • Click and drag background to pan</p>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            
            // Fetch the data from our Flask backend
            const response = await fetch('/api/graph');
            const graphData = await response.json();

            // Initialize Cytoscape.js with full interactivity
            const cy = cytoscape({
                container: document.getElementById('cy'),
                
                elements: graphData,

                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': '#0074D9',
                            'label': 'data(label)',
                            'color': '#fff',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'font-size': '14px',
                            'text-wrap': 'wrap',
                            'text-max-width': '100px',
                            'width': 60,
                            'height': 60
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 3,
                            'line-color': '#888',
                            'target-arrow-color': '#ccc',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'arrow-scale': 1.2
                        }
                    },
                    {
                        selector: 'node:active',
                        style: {
                            'background-color': '#FF6B6B',
                            'border-width': 3,
                            'border-color': '#fff'
                        }
                    }
                ],

                layout: {
                    name: 'cose',
                    animate: true,
                    animationDuration: 1000,
                    padding: 50,
                    nodeRepulsion: 4500,
                    edgeElasticity: 100
                },

                // Enable all user interactions
                boxSelectionEnabled: true,
                styleEnabled: true,
                zoomingEnabled: true,
                userZoomingEnabled: true,
                panningEnabled: true,
                userPanningEnabled: true,
                wheelSensitivity: 1,
                selectionType: 'single',
                autolock: false,
                autoungrabify: false,
                autounselectify: false
            });

            // Add click event to nodes
            cy.on('tap', 'node', function(evt){
                var node = evt.target;
                console.log('Clicked node: ' + node.data('label'));
                
                // Visual feedback when clicking
                node.style({
                    'background-color': '#FF6B6B',
                    'border-width': 3,
                    'border-color': '#fff'
                });
                
                // Reset other nodes after 1 second
                setTimeout(() => {
                    cy.nodes().style({
                        'background-color': '#0074D9',
                        'border-width': 0
                    });
                }, 1000);
            });

            console.log('Camera AI Visualizer loaded successfully!');
        });
    </script>

</body>
</html>
